AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CAVELDON contact form - serverless API with spam verification and SES delivery.
Parameters:
  AllowedSiteOrigin:
    Type: String
    Description: Exact deployed website origin, e.g. https://www.caveldon.com (no path/trailing slash).
  SenderEmail:
    Type: String
    Description: SES-verified sender identity address, e.g. hello@caveldon.com.
  NotificationEmail:
    Type: String
    Description: Inbox to receive business inquiries (e.g. hello@caveldon.com).
  SesIdentityName:
    Type: String
    Description: Verified SES identity name in this AWS region (example caveldon.com).
  TurnstileSecretArn:
    Type: String
    Description: Full ARN of Secrets Manager secret containing the Turnstile secret key as plain text.
Globals:
  Function:
    Timeout: 15
    MemorySize: 192
    Runtime: nodejs22.x
    Architectures: [arm64]
Resources:
  ContactApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedSiteOrigin]
        AllowHeaders: ['content-type']
        AllowMethods: ['POST', 'OPTIONS']
        MaxAge: 600
  ContactFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/index.handler
      Environment:
        Variables:
          CONTACT_ALLOWED_ORIGIN: !Ref AllowedSiteOrigin
          CONTACT_SENDER_EMAIL: !Ref SenderEmail
          CONTACT_NOTIFICATION_EMAIL: !Ref NotificationEmail
          CONTACT_TURNSTILE_SECRET_ARN: !Ref TurnstileSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesIdentityName}'
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref TurnstileSecretArn
      Events:
        Inquiry:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContactApi
            Path: /inquiry
            Method: POST
  ContactLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ContactFunction}'
      RetentionInDays: 14
Outputs:
  InquiryApiUrl:
    Description: Public endpoint to set as PUBLIC_CONTACT_API_URL after production review.
    Value: !Sub 'https://${ContactApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/inquiry'
